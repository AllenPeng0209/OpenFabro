site_name: OpenFabro
site_description: The open-source AI hardware engineer for circuits, enclosures and complete devices
repo_url: https://github.com/AllenPeng0209/OpenFabro
repo_name: AllenPeng0209/OpenFabro
edit_uri: edit/main/docs/
copyright: OpenFabro is free software under the GNU GPL, version 3 or later.

theme:
  name: material
  logo: assets/openfabro-mascot.png
  favicon: assets/openfabro-mascot.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen.py
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            filters: ["!^_"]
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /api/**
  /FLUX_REMAINING_CHECKLIST.md
  /reference/flux-*.md
  /reference/kicad-schematic-crossings.md
  /reference/mechanical-cad-program.md

exclude_docs: |
  /production-coordination-flux.md
  /production-mvp-result.md
  /reference/flux-*.png
  /reference/flux-*.webp
  /reference/workbench-3d.png
  /reference/workbench-first.png
  /reference/workbench-inspector.png

